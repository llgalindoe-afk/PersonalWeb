<form action="/enviar" method="POST">
  <legend>Formulario de Contacto</legend><br>
  <fieldset>
  <table>
    
    <tr>
      <td><label for="nombre">Nombre:</label></td>
      <td><input type="text" id="nombre" name="nombre" required></td>
    </tr>
    <tr>
      <td><label for="email">Email:</label></td>
      <td><input type="email" id="email" name="email" required></td>
    </tr>
    <tr>
      <td><label for="asunto">Asunto:</label></td>
      <td><input type="text" id="asunto" name="asunto" required></td>
    </tr>
    <tr>
      <td style="vertical-align: top;"><label for="mensaje">Mensaje:</label></td>
      <td><textarea id="mensaje" name="mensaje" rows="4" required></textarea></td>
    </tr>
    <tr>
      <td></td>
      <td><button type="submit">Enviar</button></td>
    </tr>
    </table>
    
  </table>
  </fieldset>
</form>
